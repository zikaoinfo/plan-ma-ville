<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Ma ville, notée — toutes les communes de France sur 10</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="La note sur 10 de chaque commune française : sécurité, santé, commerces, enseignement, sports, culture, transports et niveau de vie.">
  <!-- Marqueur robots : vide = site indexable (défaut). Les workflows de
       déploiement le remplacent par une balise noindex pour les
       préversions. Détails : docs/SEO-INDEXATION.md -->
  <!-- SEO_ROBOTS -->
  <meta name="theme-color" content="#f8f8fc">
  <!-- Anti-flash : pose data-theme, data-accent ET la theme-color AVANT le
       chargement d'Angular. Doit rester aligné avec ThemeService (clé
       mvn-theme, défaut system, couleurs META_THEME_COLOR) et AccentService
       (clé mvn-accent, défaut orange). -->
  <script>
    (function () {
      var theme = 'light';
      var accent = 'orange';
      try {
        var pref = localStorage.getItem('mvn-theme');
        var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        theme = pref === 'dark' || (pref !== 'light' && systemDark) ? 'dark' : 'light';
        var acc = localStorage.getItem('mvn-accent');
        if (acc === 'jaune' || acc === 'vert' || acc === 'bleu') accent = acc;
      } catch (e) { /* stockage/matchMedia indisponibles : clair + orange */ }
      document.documentElement.dataset.theme = theme;
      document.documentElement.dataset.accent = accent;
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', theme === 'dark' ? '#12102a' : '#f8f8fc');
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <!-- Police auto-hébergée (fini fonts.gstatic.com) : préchargée pour
       raccourcir le chemin critique. font-display: optional (styles.scss)
       évite le reflow au swap qui causait le CLS. -->
  <link rel="preload" href="fonts/instrument-sans-variable-latin.woff2" as="font" type="font/woff2" crossorigin>
  <!-- Placé après les ressources critiques : le manifeste PWA n'est pas
       bloquant pour le rendu (chaîne critique la plus longue signalée par
       Lighthouse — n'affecte pas le FCP réel, cf. plan Lighthouse tâche 5). -->
  <link rel="manifest" href="manifest.webmanifest">
  <!-- Umami (analytics respectueuse de la vie privée, pas de cookie) -->
  <script defer src="https://cloud.umami.is/script.js" data-website-id="06e517be-6059-42b1-8c7a-4fc3a5a4e104"></script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
